name: Deploy to 1Gb
on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-1gb
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Check PHP syntax
        run: find public -name '*.php' -print0 | xargs -0 -n1 php -l
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install paramiko==3.5.1
      - name: Upload public directory via SFTP
        env:
          SFTP_USERNAME: ${{ secrets.SFTP_USERNAME }}
          SFTP_PASSWORD: ${{ secrets.SFTP_PASSWORD }}
          SFTP_HOST_FINGERPRINT: ${{ secrets.SFTP_HOST_FINGERPRINT }}
        shell: python
        run: |
          import base64
          import hashlib
          import hmac
          import os
          import json
          import re
          import stat
          from pathlib import Path, PurePosixPath
          import paramiko

          source = Path("public")
          if not (source / "index.html").is_file():
              raise SystemExit("public/index.html is missing; deployment stopped.")
          for name in ("SFTP_USERNAME", "SFTP_PASSWORD", "SFTP_HOST_FINGERPRINT"):
              if not os.environ.get(name, "").strip():
                  raise SystemExit(f"Missing GitHub secret: {name}")

          class PinnedKey(paramiko.MissingHostKeyPolicy):
              def missing_host_key(self, client, hostname, key):
                  actual = "SHA256:" + base64.b64encode(
                      hashlib.sha256(key.asbytes()).digest()
                  ).decode().rstrip("=")
                  expected = os.environ["SFTP_HOST_FINGERPRINT"].strip()
                  if not hmac.compare_digest(actual, expected):
                      raise paramiko.SSHException("Server host key fingerprint mismatch")

          root = PurePosixPath("/home/virtwww/w_360-room260_fd79d09d/http")
          with paramiko.SSHClient() as client:
              client.set_missing_host_key_policy(PinnedKey())
              client.connect(
                  "ftp.360-room260.1gb.ru", port=2222,
                  username=os.environ["SFTP_USERNAME"],
                  password=os.environ["SFTP_PASSWORD"],
                  look_for_keys=False, allow_agent=False,
                  timeout=30, banner_timeout=30, auth_timeout=30,
              )
              with client.open_sftp() as sftp:
                  if not stat.S_ISDIR(sftp.stat(str(root)).st_mode):
                      raise SystemExit("Remote website directory does not exist")
                  if (source / "pro").exists():
                      raise SystemExit("Runtime project data must not be included in the deployment source")
                  # Keep existing credentials on the hosting, outside the document root.
                  auth_path = str(root.parent / ".room26-auth.json")
                  try:
                      with sftp.open(auth_path, "r") as saved:
                          credentials = json.loads(saved.read().decode("utf-8"))
                      if not credentials.get("username") or not credentials.get("password_hash"):
                          raise SystemExit("Invalid hosting authentication configuration")
                  except FileNotFoundError:
                      with sftp.open(str(root / "admin/index.php"), "r") as old:
                          legacy = old.read().decode("utf-8")
                      match = re.search(r"password_verify\(\$password,\s*'(\$2[aby]\$[0-9]{2}\$[./A-Za-z0-9]{53})'", legacy)
                      if not match:
                          raise SystemExit("Existing authentication configuration not found; deployment stopped")
                      credentials = {"username": "Irina", "password_hash": match.group(1)}
                      temporary_auth = auth_path + ".deploy-tmp"
                      with sftp.open(temporary_auth, "w") as saved:
                          saved.write(json.dumps(credentials))
                      sftp.chmod(temporary_auth, 0o600)
                      sftp.posix_rename(temporary_auth, auth_path)
                  sftp.chmod(auth_path, 0o600)
                  files = sorted(source.rglob("*"))
                  if any(path.is_symlink() for path in files):
                      raise SystemExit("Symlinks are not allowed in public/")
                  for path in files:
                      target = str(root / path.relative_to(source).as_posix())
                      if path.is_dir():
                          try:
                              mode = sftp.stat(target).st_mode
                          except FileNotFoundError:
                              sftp.mkdir(target)
                          else:
                              if not stat.S_ISDIR(mode):
                                  raise SystemExit("Remote directory conflicts with a file")
                      elif path.is_file():
                          temporary = target + ".deploy-tmp"
                          sftp.put(str(path), temporary)
                          sftp.posix_rename(temporary, target)
                  # Shared hosting may create PHP upload directories with a restrictive umask.
                  # Repair only public media permissions; document payloads remain private.
                  media_root = str(root / "pro")
                  try:
                      project_ids = sftp.listdir(media_root)
                  except FileNotFoundError:
                      project_ids = []
                  else:
                      sftp.chmod(media_root, 0o755)
                  for project_id in project_ids:
                      if not re.fullmatch(r"[a-f0-9]{6}", project_id):
                          continue
                      project_root = str(root / "pro" / project_id)
                      sftp.chmod(project_root, 0o755)
                      for section in ("360", "3d", "doc", "photo"):
                          folder = project_root + "/" + section
                          try:
                              media_files = sftp.listdir(folder)
                          except FileNotFoundError:
                              continue
                          sftp.chmod(folder, 0o755)
                          if section == "doc":
                              continue
                          for media_file in media_files:
                              if re.fullmatch(r"[a-f0-9]{6}(?:-(?:thumb|og)\.jpg|\.(?:jpg|png|webp|gif|avif|glb))", media_file):
                                  sftp.chmod(folder + "/" + media_file, 0o644)
          print("Deployment completed.")
